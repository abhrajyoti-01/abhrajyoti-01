name: Refresh Profile README

on:
  schedule:
    # Every 30 min, off the :00 rush. GitHub delays or drops scheduled runs under
    # load, so two slots per hour keep frames arriving roughly hourly or better.
    - cron: '11,41 * * * *'
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs

permissions:
  contents: write

concurrency:
  group: readme-update
  cancel-in-progress: false # queue runs so a frame is never dropped mid-commit

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh live GitHub data
        # An API hiccup must not freeze the game; the data simply stays as it was.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: abhrajyoti-01
        run: node .github/scripts/update-readme.js

      - name: Advance /dev/dungeon by one frame
        run: node .github/scripts/tick-dungeon.js

      - name: Publish the replay to the output branch
        # The replay SVG is rewritten every run, so it lives alone on a
        # force-pushed orphan branch instead of piling up in main's history.
        run: |
          out=$(mktemp -d)
          cp assets/dungeon.svg "$out/"
          cd "$out"
          git init -q -b output
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dungeon.svg
          git commit -qm "/dev/dungeon replay"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "ℹ️  Nothing changed"
            exit 0
          fi
          frame=$(node -p "require('./game/state.json').tick")
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md game/state.json assets/lang-dist.svg
          git commit -m "🎮 /dev/dungeon frame #${frame} · README sync [skip ci]"
          git push || { git pull --rebase && git push; }
